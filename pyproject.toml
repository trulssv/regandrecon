[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regandrecon"
version = "0.1.0"
description = "Simultaneous Registration and Reconstruction with deep learning in 4D CT"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "model*", "operators*", "train*", "visualization*", "test*"]
